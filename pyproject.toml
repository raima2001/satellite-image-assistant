[project]
name = "satellite-image-assistant"
version = "0.1.0"
description = "A conversational assistant for finding and comparing Sentinel-2 imagery."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "mcp>=1.30.0",
    "langchain-mcp-adapters>=0.3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain-openai>=1.6.7",
    "langchain-core>=1.6.6",
    "typing-extensions>=4.16.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]
